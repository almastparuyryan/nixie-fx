<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button edge spark · PixiJS + NixieFX</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">NixieFX / PixiJS 8 example</p>
      <h1>Button edge spark</h1>
      <p>Press the claim button to replay a short cyan burst along its edge.</p>
      <section id="stage" aria-label="Particle effect preview">
        <button id="claim" type="button"><img src="/button-icon.svg" alt="" /> Claim reward</button>
      </section>
      <p id="status" role="status">Loading effect…</p>
      <p class="note">The button remains usable when effects are disabled. Try the Reduced Motion setting in your system preferences.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
